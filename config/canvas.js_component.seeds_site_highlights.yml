js:
  original: |
    export default function Highlights(props) {
      const items = [1, 2, 3]
        .map((n) => ({ title: props[`item${n}Title`], text: props[`item${n}Text`] }))
        .filter((item) => item.title);
      return (
        <section className="seeds-site-highlights">
          <h2 className="seeds-site-section-heading">{props.heading}</h2>
          <div className="seeds-site-highlights__items">
            {items.map((item) => (
              <div className="seeds-site-highlights__item" key={item.title}>
                <h3>{item.title}</h3>
                {item.text && <p>{item.text}</p>}
              </div>
            ))}
          </div>
        </section>
      );
    }
  compiled: |
    import { jsx, jsxs } from "react/jsx-runtime";
    export default function Highlights(props) {
      const items = [1, 2, 3].map((n) => ({ title: props[`item${n}Title`], text: props[`item${n}Text`] })).filter((item) => item.title);
      return jsxs("section", { className: "seeds-site-highlights", children: [
        jsx("h2", { className: "seeds-site-section-heading", children: props.heading }),
        jsx("div", { className: "seeds-site-highlights__items", children: items.map((item) => jsxs("div", { className: "seeds-site-highlights__item", children: [
          jsx("h3", { children: item.title }),
          item.text && jsx("p", { children: item.text })
        ] }, item.title)) })
      ] });
    }
