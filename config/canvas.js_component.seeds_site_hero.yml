langcode: en
status: true
dependencies: {}
machineName: seeds_site_hero
name: 'Seeds site: Hero'
required:
- heading
props:
  heading:
    title: Heading
    type: string
    examples:
    - Welcome to our organisation
  text:
    title: Text
    type: string
    examples:
    - We work with communities to create lasting change.
  buttonText:
    title: Button text
    type: string
    examples:
    - Learn more
  buttonUrl:
    title: Button link
    type: string
    format: uri-reference
    examples:
    - /contact-us
  image:
    title: Image
    type: object
    $ref: json-schema-definitions://canvas.module/image
    examples:
    - src: https://placehold.co/1200x600@2x.png?text=Image
      width: 1200
      height: 600
      alt: Image
slots: {}
js:
  original: |
    export default function Hero({ heading, text, buttonText, buttonUrl, image }) {
      return (
        <section className="seeds-site-hero">
          <div className="seeds-site-hero__content">
            <h1 className="seeds-site-hero__heading">{heading}</h1>
            {text && <p className="seeds-site-hero__text">{text}</p>}
            {buttonText && buttonUrl && (
              <a className="seeds-site-button" href={buttonUrl}>{buttonText}</a>
            )}
          </div>
          {image?.src && (
            <img className="seeds-site-hero__image" src={image.src} alt={image.alt || ''} />
          )}
        </section>
      );
    }
  compiled: |
    import { jsx, jsxs } from "react/jsx-runtime";
    export default function Hero({ heading, text, buttonText, buttonUrl, image }) {
      return jsxs("section", { className: "seeds-site-hero", children: [
        jsxs("div", { className: "seeds-site-hero__content", children: [
          jsx("h1", { className: "seeds-site-hero__heading", children: heading }),
          text && jsx("p", { className: "seeds-site-hero__text", children: text }),
          buttonText && buttonUrl && jsx("a", { className: "seeds-site-button", href: buttonUrl, children: buttonText })
        ] }),
        image?.src && jsx("img", { className: "seeds-site-hero__image", src: image.src, alt: image.alt || "" })
      ] });
    }
css:
  original: |
    .seeds-site-hero {
      display: grid;
      gap: 2rem;
      align-items: center;
      padding: 4rem 1.5rem;
      background: #f3f6fa;
      border-radius: 16px;
    }
    @media (min-width: 992px) {
      .seeds-site-hero { grid-template-columns: 1fr 1fr; padding: 5rem 4rem; }
    }
    .seeds-site-hero__heading { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.15; margin: 0 0 1rem; }
    .seeds-site-hero__text { font-size: 1.25rem; line-height: 1.6; color: #44505c; margin: 0 0 2rem; }
    .seeds-site-hero__image { width: 100%; height: auto; border-radius: 12px; object-fit: cover; }
    .seeds-site-button {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      border-radius: 8px;
      background: #1890ff;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .seeds-site-button:hover, .seeds-site-button:focus { background: #0f6fcc; color: #fff; }
