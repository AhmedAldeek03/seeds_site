langcode: en
status: true
dependencies:
  enforced:
    module:
    - canvas
id: global
label: Global CSS
css:
  original: |
    /*
     * Seeds site: a light look for the Seeds UI base theme.
     *
     * Seeds UI ships its layout markup but almost no CSS (styling is meant to
     * live in a subtheme). These styles give a fresh site a finished look. They
     * are loaded on every front-end page through the Canvas global asset library
     * (Canvas > Code > Global CSS), so site builders can change them there, or
     * remove them once the site has its own subtheme.
     */
    :root {
      --seeds-site-primary: #1890ff;
      --seeds-site-primary-dark: #0f6fcc;
      --seeds-site-ink: #14202b;
      --seeds-site-muted: #5a6875;
      --seeds-site-line: #e3e8ef;
      --seeds-site-soft: #f3f6fa;
      --seeds-site-dark: #0f2a44;
      --seeds-site-radius: 12px;
      --seeds-site-width: 1200px;
    }

    body {
      margin: 0;
      color: var(--seeds-site-ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      background: #fff;
    }
    img { max-width: 100%; height: auto; }
    a { color: var(--seeds-site-primary); }
    a:hover, a:focus { color: var(--seeds-site-primary-dark); }

    /* Width of the page content. */
    .container,
    #main,
    .featured-top__inner,
    .highlighted > aside,
    footer.site-footer > div {
      box-sizing: border-box;
      width: 100%;
      max-width: var(--seeds-site-width);
      margin-inline: auto;
      padding-inline: 1.25rem;
    }
    #main { padding-block: 1rem 4rem; }

    /* Bootstrap-style helpers used by the Seeds UI templates. */
    .d-none { display: none !important; }
    .d-block { display: block !important; }
    .d-flex { display: flex !important; }
    .flex-wrap { flex-wrap: wrap; }
    .justify-content-between { justify-content: space-between; }
    .align-items-center { align-items: center; }
    .position-relative { position: relative; }
    .mb-2 { margin-bottom: 0.5rem; }
    @media (min-width: 992px) {
      .d-lg-none { display: none !important; }
      .d-lg-flex { display: flex !important; }
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fff;
      border-bottom: 1px solid var(--seeds-site-line);
    }
    .header-main { padding-block: 0.75rem; }
    .header-main > .container > .row > div,
    .header-main > :not(.container) {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-main {
      box-sizing: border-box;
      max-width: var(--seeds-site-width);
      margin-inline: auto;
      padding-inline: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-left { gap: 2.5rem; }
    .site-branding__inner {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header-logo img { display: block; width: auto; height: 44px; }
    .header-logo a {
      color: var(--seeds-site-ink);
      font-weight: 700;
      font-size: 1.15rem;
      text-decoration: none;
    }
    .navbar-toggler {
      border: 1px solid var(--seeds-site-line);
      border-radius: 8px;
      background: #fff;
      padding: 0.4rem;
      cursor: pointer;
    }
    .navbar-toggler svg { display: block; width: 24px; height: 24px; fill: var(--seeds-site-ink); }

    /* Main menu */
    .region--navigation ul.menu {
      display: flex;
      gap: 0.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .region--navigation .menu__item { position: relative; }
    .region--navigation .menu__link {
      display: block;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      color: var(--seeds-site-ink);
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }
    .region--navigation .menu__link:hover,
    .region--navigation .menu__link:focus,
    .region--navigation .menu__link--active-trail { background: var(--seeds-site-soft); color: var(--seeds-site-primary); }
    .region--navigation .menu__item--has-children > .menu__link::after {
      content: "";
      display: inline-block;
      margin-left: 0.4rem;
      border: solid currentColor;
      border-width: 0 2px 2px 0;
      padding: 2.5px;
      transform: translateY(-3px) rotate(45deg);
    }
    .navigation-bar .menu--level-2 {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 200px;
      display: none !important;
      flex-direction: column;
      padding: 0.5rem !important;
      background: #fff;
      border: 1px solid var(--seeds-site-line);
      border-radius: var(--seeds-site-radius);
      box-shadow: 0 12px 24px rgba(20, 32, 43, 0.08);
    }
    .navigation-bar .menu__item--has-children:hover > .menu--level-2,
    .navigation-bar .menu__item--has-children:focus-within > .menu--level-2 { display: flex !important; }

    /* Mobile menu */
    .mobile-collapse { border-top: 1px solid var(--seeds-site-line); }
    .collapse-content { flex-direction: column; padding: 1rem 1.25rem; }
    .mobile-navigation ul.menu { flex-direction: column; }
    .mobile-navigation .menu--level-2 { padding-left: 1rem !important; }

    /* Page title and tabs */
    .featured-top { padding-top: 2.5rem; }
    .featured-top h1,
    .page-title { margin: 0 0 1.5rem; font-size: clamp(1.9rem, 3.5vw, 2.6rem); line-height: 1.2; }
    .featured-top ul.tabs,
    .featured-top nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 1.5rem;
      padding: 0;
      list-style: none;
    }
    .featured-top nav ul a {
      display: block;
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--seeds-site-line);
      border-radius: 999px;
      font-size: 0.9rem;
      text-decoration: none;
    }

    /* Messages */
    .highlighted { padding-top: 1rem; }

    /* Card grids: News and Events listings and home page blocks */
    .view-content.row,
    .view-content {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    }
    .view-content > .views-row { display: flex; }
    .card-default {
      display: flex;
      flex-direction: column;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--seeds-site-line);
      border-radius: var(--seeds-site-radius) !important;
      background: #fff;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .card-default:hover { box-shadow: 0 12px 24px rgba(20, 32, 43, 0.08); transform: translateY(-2px); }
    .card-default-image img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    .card-content { display: flex; flex: 1; flex-direction: column; padding: 1.25rem 1.25rem 1.5rem; background: none !important; }
    .card-default-title { font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
    .card-default-body { color: var(--seeds-site-muted); }
    .card-default-body p { margin: 0; }
    .card-default-link { margin-top: auto; padding-top: 0.75rem; }
    .card-default-link a { font-weight: 600; text-decoration: none; }
    .card-default-link a::after { content: " →"; }
    .card-content .field--label-inline,
    .card-content .field__label { color: var(--seeds-site-muted); font-size: 0.9rem; }

    /* Home page block headings (Latest news, Upcoming events) */
    #main .block > h2 {
      margin: 3rem 0 1.5rem;
      font-size: 2rem;
      text-align: center;
    }

    /* Pager */
    nav.pager ul, .pager__items {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 2.5rem 0 0;
      padding: 0;
      list-style: none;
    }
    .pager__item a { display: block; padding: 0.4rem 0.8rem; border: 1px solid var(--seeds-site-line); border-radius: 8px; text-decoration: none; }
    .pager__item.is-active a { background: var(--seeds-site-primary); border-color: var(--seeds-site-primary); color: #fff; }

    /* Full News and Event pages */
    .node--view-mode-full,
    article.node { max-width: 820px; }
    .field--name-field-media img { border-radius: var(--seeds-site-radius); }
    .field--name-field-body { font-size: 1.1rem; }

    /* Forms (Contact us, Search) */
    .webform-submission-form,
    .views-exposed-form { max-width: 640px; }
    .form-item { margin-bottom: 1.25rem; }
    .form-item label { display: block; margin-bottom: 0.35rem; font-weight: 600; }
    input[type="text"],
    input[type="email"],
    input[type="search"],
    input[type="tel"],
    textarea,
    select {
      box-sizing: border-box;
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid #c9d2dc;
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--seeds-site-primary); outline: 3px solid rgba(24, 144, 255, 0.2); }
    .button,
    input[type="submit"],
    button.form-submit {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border: 0;
      border-radius: 8px;
      background: var(--seeds-site-primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .button:hover, input[type="submit"]:hover, button.form-submit:hover { background: var(--seeds-site-primary-dark); }
    .views-exposed-form { display: flex; gap: 0.75rem; align-items: flex-end; margin-bottom: 2rem; }
    .views-exposed-form .form-item { flex: 1; margin: 0; }

    /* Footer */
    footer.site-footer {
      margin-top: 4rem;
      padding: 3rem 0 1.5rem;
      background: var(--seeds-site-dark);
      color: #c7d3df;
    }
    footer.site-footer a { color: #fff; text-decoration: none; }
    footer.site-footer a:hover { text-decoration: underline; }
    footer.site-footer ul.menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 2rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .site-footer__bottom {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.9rem;
    }

    /* Canvas sections sit inside the page width */
    .seeds-site-hero, .seeds-site-cta { margin-top: 1.5rem; }
