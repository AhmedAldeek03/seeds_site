langcode: en
status: true
dependencies:
  config:
    - node.type.event
    - node.type.news
  module:
    - content_moderation
id: seeds_editorial
label: 'Seeds editorial'
type: content_moderation
type_settings:
  states:
    draft:
      label: Draft
      weight: -10
      published: false
      default_revision: false
    review:
      label: 'In review'
      weight: -5
      published: false
      default_revision: false
    published:
      label: Published
      weight: 0
      published: true
      default_revision: true
    archived:
      label: Archived
      weight: 5
      published: false
      default_revision: true
  transitions:
    create_new_draft:
      label: 'Save as draft'
      from:
        - draft
        - published
      to: draft
      weight: 0
    submit_for_review:
      label: 'Submit for review'
      from:
        - draft
        - review
      to: review
      weight: 1
    send_back:
      label: 'Send back to draft'
      from:
        - review
      to: draft
      weight: 2
    publish:
      label: Publish
      from:
        - draft
        - review
        - published
      to: published
      weight: 3
    archive:
      label: Archive
      from:
        - published
      to: archived
      weight: 4
    restore_draft:
      label: 'Restore to draft'
      from:
        - archived
      to: draft
      weight: 5
    restore:
      label: Restore
      from:
        - archived
      to: published
      weight: 6
  entity_types:
    node:
      - event
      - news
  default_moderation_state: draft
